# Permissions from https://github.com/OpenVisualCloud/Media-Transport-Library/tree/main/docker#run-with-dpdk
# But IPC_LOCK doesn't seem necessary.
# see ../../docs/st_2110.md for detailsO
services:
  ffmpeg-st2110-to-mxl-v:
    image: ghcr.io/cbcrc/ffmpeg-mxl-imtl:latest
    container_name: ffmpeg-st2110-to-mxl-v
    network_mode: "host"
    user: ${UID}:${GUI}
    devices:
      - /dev/vfio/
    cap_add:
      - SYS_NICE
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /var/run/imtl:/var/run/imtl
      - /dev/shm/mxl/st2110:/domain
    entrypoint: ["/opt/bin/ffmpeg"]
    command:
      - -pacing_way
      - tsc
      - -interlaced
      - "1"
      - -p_port
      - "${RX_PCI_ADDR}"
      - -p_sip
      - "${LOCAL_IFACE_IP}"
      - -p_rx_ip
      - "${RX_VIDEO_MCAST_IP}"
      - -udp_port
      - "20000"
      - -payload_type
      - "96"
      - -fps
      - "29.97"
      - -pix_fmt
      - yuv422p10le
      - -video_size
      - 1920x1080
      - -f
      - mtl_st20p
      - -i
      - k
      - -c:v
      - v210
      - -f
      - mxl
      - -video_flow_id
      - ${VIDEO_FLOW_ID}
      - /domain

  ffmpeg-mxl-to-st2110-v:
    image: ghcr.io/cbcrc/ffmpeg-mxl-imtl:latest
    container_name: ffmpeg-mxl-to-st2110-v
    depends_on:
      - ffmpeg-mxl-to-rtp
    network_mode: "host"
    user: ${UID}:${GUI}
    devices:
      - /dev/vfio/
    cap_add:
      - SYS_NICE
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /var/run/imtl:/var/run/imtl
      - /dev/shm/mxl/st2110:/domain
    entrypoint: ["/opt/bin/ffmpeg"]
    command:
      - -hide_banner
      - -nostats
      - -threads
      - "1"
      - -f
      - mxl
      - -blocking
      - "-1"
      - -on_too_late
      - "1"
      - -grain_index_init
      - "0"
      - -i
      - "mxl:///domain?id=${VIDEO_FLOW_ID}"
      - -pix_fmt
      - yuv422p10le
      - -vcodec
      - rawvideo
      - -pacing_way
      - tsc
      - -video_size
      - 1920x1080
      - -fps
      - "59.94"
      - -interlaced
      - "1"
      - -p_port
      - "${TX_PCI_ADDR}"
      - -p_sip
      - "${LOCAL_IFACE_IP}"
      - -p_tx_ip
      - "${TX_VIDEO_MCAST_IP}"
      - -udp_port
      - "20000"
      - -payload_type
      - "96"
      - -pix_fmt
      - yuv422p10le
      - -f
      - mtl_st20p
      - "-"

  ffmpeg-mxl-to-rtp:
    image: ghcr.io/cbcrc/ffmpeg-mxl-prod:latest
    container_name: ffmpeg-mxl-to-rtp
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - type: bind
        source: /dev/shm/mxl/st2110/
        target: /domain
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 40
    environment:
      # --- Required Variables ---
      - MXL_DOMAIN=/domain
      - VIDEO_ID=${VIDEO_FLOW_ID}
      - RTSP_URL=rtsp://${MEDIAMTX_HOST:-127.0.0.1}:8554/st2110
      #  --- Optional ---
      - FFMPEG_LOGLEVEL=info
      - FFMPEG_MODE=cpu
      - FFMPEG_RT_PRIORITY=40
      - RTSP_TRANSPORT=tcp
