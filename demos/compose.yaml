services:
  init:
    image: alpine
    command: ["sh", "-c", "mkdir -p /dev/shm/cbc"]
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
    restart: no

  ffmpeg-source:
    image: ghcr.io/cbcrc/ffmpeg-mxl-nab-demo:latest
    depends_on:
      - init
    restart: unless-stopped
    entrypoint: "/opt/bin/ffmpeg"
    volumes:
      - type: bind
        source: ./
        target: /tmp/
      - type: bind
        source: /dev/shm/cbc
        target: /domain
    command:
      - "-hide_banner"
      - "-re"
      - "-stream_loop"
      - "-1"
      - "-i"
      - "/tmp/demo_reel.ts"
      - "-vf"
      - "drawtext=text='CBC/RC - BREAKING NEWS - FFmpeg now supports MXL!':x='mod(w-t*200, w+tw)-tw':y=h-th-50:fontfile=/usr/share/fonts/truetype/freefont/FreeSansBold.ttf:fontcolor=white:fontsize=100:shadowcolor=red:shadowx=5:shadowy=5"
      - "-c:v"
      - "v210"
      - "-f"
      - "mxl"
      - "-video_flow_id"
      - "fe781cad-8a82-4b8e-a3c2-f833c70ac73e"
      - "/domain"

  ffmpeg-probe:
    image: ghcr.io/cbcrc/ffmpeg-mxl-nab-demo:latest
    depends_on:
      - ffmpeg-source
    entrypoint: "/opt/bin/ffprobe"
    volumes:
      - type: bind
        source: /dev/shm/cbc
        target: /domain
    command: "-hide_banner \
      /domain/fe781cad-8a82-4b8e-a3c2-f833c70ac73e.mxl-flow"
    restart: no

  ffmpeg-dest:
    image: ghcr.io/cbcrc/ffmpeg-mxl-prod:v1.0.0
    depends_on:
      - mediamtx
      - ffmpeg-source
    restart: unless-stopped
    network_mode: "host"
    entrypoint: "/opt/bin/ffmpeg"
    volumes:
      - type: bind
        source: /dev/shm/cbc
        target: /domain
    command: "-hide_banner \
      -i /domain/fe781cad-8a82-4b8e-a3c2-f833c70ac73e.mxl-flow \
      -vf 'scale=1280:720,format=yuv420p' \
      -vcodec libx264 -preset fast -tune zerolatency -b:v 5M \
      -x264-params 'sliced-threads=1:sync-lookahead=0' \
      -f rtsp rtsp://127.0.0.1:8554/mxlstream"

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MTX_RTSPTRANSPORTS=tcp
    ports:
      - "8554:8554"
      - "8322:8322"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8890:8890/udp"
      - "8189:8189/udp"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
